<noscript><p style="padding:24px">Pump &amp; Dump '87 is a browser game and needs JavaScript. Pump &amp; Dump '87 ist ein Browserspiel und braucht JavaScript.</p></noscript>
<main id="app">

  <section id="s-title" aria-labelledby="logo" hidden>
    <div class="title-pad pad">
      <canvas id="titleFace" width="320" height="320" aria-hidden="true"></canvas>
      <h1 class="logo" id="logo">Pump &amp; Dump <span>'87</span></h1>
      <p class="tagline" data-t="tagline"></p>

  g.strokeStyle = up ? 'rgba(46,122,58,.22)' : 'rgba(200,38,27,.2)'; g.lineWidth = 2;
  for (let x = -h; x < w; x += 12) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h, 0); g.stroke(); }

  fxAt(el, nearPrice ? Math.max(60, b.width * (b.width > 700 ? 0.42 : 0.6)) : 64, nearPrice ? 40 : b.height * (b.width > 700 ? 0.62 : 0.2), 950);
}
function shake() { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const b = $('board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

// ---- Results and sharing ----------------------------------------------------------------
function shareUrl() {
  const u = new URL(SITE), s = state;
  if (current.mode === 'daily') u.searchParams.set('d', current.day); else u.searchParams.set('seed', current.seed);
  u.searchParams.set('beat', String(s.score)); u.searchParams.set('by', nameOrDefault());
  if (lang === 'en') u.searchParams.set('lang', 'en');
  return u.toString();
}
function shareText() {
  const s = state, e = s.end, pts = s.history.slice(0, e.histLen), n = 10, blocks = [];
  for (let i = 0; i < n; i++) { const a = pts[Math.floor(i * (pts.length - 1) / n)], b = pts[Math.floor((i + 1) * (pts.length - 1) / n)]; blocks.push(b >= a ? '🟩' : '🟥'); }
  const endMark = { dump: '💸', raid: '🚨', halt: '🪦' }[e.kind] + ' ' + S[lang].shareEnd[e.kind];
  return [current.mode === 'daily' ? T('shareHead', { n: current.day }) : T('shareFree'), '$' + s.co[2] + ' ' + blocks.join('') + ' ' + endMark,
    (e.kind === 'dump' ? T('take_') : T('onPaper')) + ': ' + fmtMoney(e.kind === 'dump' ? e.payout : e.paper), T('shareLies', { n: s.lies }), shareUrl()].join('\n');
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } ta.remove(); return ok;
  }
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }
async function shareImage() {
  const blob = await new Promise(res => paper.toBlob(res, 'image/png'));
  if (!blob) return;
  const file = new File([blob], 'pump-and-dump-87-' + state.co[2].toLowerCase() + '.png', { type: 'image/png' });
  const text = shareText();
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  await copy(text); toast(T('saved'));
}
async function dare() {
  const url = shareUrl(), text = T('challenge', { by: nameOrDefault(), ticker: '$' + state.co[2], v: fmtMoney(state.score) });
  if (navigator.share && matchMedia('(pointer: coarse)').matches) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  if (await copy(text + '\n' + url)) toast(T('dareCopied'));
}
async function paintResults() {
  applyWords();
  try { await document.fonts.load('700 40px Antonio'); await document.fonts.load('400 40px Antonio'); } catch (e) { /* fall back to the system face */ }
  const e = state.end; drawPaper(paper);
  const [head] = headlineFor(e);
  paper.setAttribute('aria-label', head);
  setText($('rTitle'), rankFor(e));
  setText($('rBig'), (e.kind === 'dump' ? T('take_') : T('onPaper')) + ': ' + fmtMoney(e.kind === 'dump' ? e.payout : e.paper));
  const vs = $('rVs');
  if (challenge && challenge.run.seed === current.seed) { vs.hidden = false; vs.textContent = T(state.score > challenge.beat ? 'vsWin' : 'vsLose', { by: challenge.by, you: fmtMoney(state.score), them: fmtMoney(challenge.beat) }); }
  else vs.hidden = true;
}
function paintFigures() {
  const box = $('s-figures'); box.innerHTML = '';
  ['greedy', 'cautious', 'narc', 'whale', 'mom'].forEach((k, i) => {
    const f = document.createElement('figure'), c = document.createElement('canvas'); c.width = c.height = 400;
    const cap = document.createElement('figcaption'); cap.textContent = T('figNames')[k];
    f.append(c, cap); box.appendChild(f); drawFace(c, k, 1234 + i * 99);
  });
}

// ---- Wiring ---------------------------------------------------------------------------
$('startBtn').addEventListener('click', () => { readName(); start(challenge ? challenge.run : current); });
$('freeBtn').addEventListener('click', () => { readName(); start(runFor(0, 1 + Math.floor(Math.random() * 2e9))); }); // a new seed is the one place Math.random picks
$('freeBtn2').addEventListener('click', () => start(runFor(0, 1 + Math.floor(Math.random() * 2e9))));
$('againBtn').addEventListener('click', () => start(current));
$('shareBtn').addEventListener('click', shareImage);
$('copyBtn').addEventListener('click', async () => { if (await copy(shareText())) toast(T('copied')); });
$('dareBtn').addEventListener('click', dare);
$('langBtn').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; store.set('lang', lang); paintTitle(); });
for (const id of ['muteBtn', 'muteBtnT']) $(id).addEventListener('click', () => { startAudio(); setMuted(!muted); });
$('pauseBtn').addEventListener('click', () => { if (scene === 'play') setScene('pause'); });
$('resumeBtn').addEventListener('click', () => { if (scene === 'pause') setScene('play'); });
for (const b of $('replies').children) b.addEventListener('click', () => answer(Number(b.dataset.i)));
for (const [id, key] of [['shredBtn', 'shred'], ['dumpBtn', 'dump']]) {
  const b = $(id);
  b.addEventListener('pointerdown', ev => { ev.preventDefault(); b.setPointerCapture(ev.pointerId); ui[key] = true; });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(t, () => { ui[key] = false; });
  b.addEventListener('contextmenu', ev => ev.preventDefault());
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  drawFrame();
}
function drawFrame() { if (scene === 'play' || scene === 'pause' || scene === 'ending') { drawChart(); paintHud(); } }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) step(); if (draw) drawFrame(); },
};

reset();
const first = params.get('scene');
if (first === 'play') start(current); else setScene(first && scenes[first] ? first : 'title');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
